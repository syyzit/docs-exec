name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Dogfood list
        run: docs-exec list --files examples/sample.md
      - name: Dogfood passing run
        run: |
          printf '# passing\n\n```bash\necho ok\n```\n' > /tmp/docs-exec-passing.md
          docs-exec run --files /tmp/docs-exec-passing.md
      - name: Dogfood mixed run exits 10
        run: |
          set +e
          docs-exec run --files examples/sample.md --timeout 30
          code=$?
          if [ "$code" -ne 10 ]; then
            echo "expected exit 10, got $code"
            exit 1
          fi
